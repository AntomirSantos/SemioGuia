<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- parede torácica posterior -->
  <path d="M 62 24 C 56 66, 64 124, 78 176 L 162 176 C 176 124, 184 66, 178 24" stroke-width="2" />
  <!-- coluna vertebral -->
  <path d="M 120 26 L 120 174" stroke-width="1.2" stroke-dasharray="3 4" />
  <!-- escápulas -->
  <g stroke-width="1.2">
    <path d="M 74 46 L 92 52 L 84 92 Z" />
    <path d="M 166 46 L 148 52 L 156 92 Z" />
  </g>
  <!-- caminho da comparação: trechos entre os pontos homólogos -->
  <g stroke-width="1.2" stroke-dasharray="4 3">
    <path d="M 110 50 L 130 50" />
    <path d="M 132 58 L 108 72" />
    <path d="M 110 80 L 130 80" />
    <path d="M 132 88 L 108 102" />
    <path d="M 110 110 L 130 110" />
    <path d="M 132 118 L 108 132" />
    <path d="M 110 140 L 130 140" />
  </g>
  <!-- pontos homólogos -->
  <g stroke-width="1.5">
    <circle cx="102" cy="50" r="8" />
    <circle cx="138" cy="50" r="8" />
    <circle cx="102" cy="80" r="8" />
    <circle cx="138" cy="80" r="8" />
    <circle cx="102" cy="110" r="8" />
    <circle cx="138" cy="110" r="8" />
    <circle cx="102" cy="140" r="8" />
    <circle cx="138" cy="140" r="8" />
  </g>
  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="102" y="53">1</text>
    <text x="138" y="53">2</text>
    <text x="102" y="83">3</text>
    <text x="138" y="83">4</text>
    <text x="102" y="113">5</text>
    <text x="138" y="113">6</text>
    <text x="102" y="143">7</text>
    <text x="138" y="143">8</text>
  </g>
  <!-- nota -->
  <g font-family="sans-serif" font-size="9.5" fill="currentColor" stroke="none">
    <text x="198" y="58">Compare regiões</text>
    <text x="198" y="72">homólogas, alternando</text>
    <text x="198" y="86">os lados, do ápice</text>
    <text x="198" y="100">para as bases.</text>
    <text x="198" y="126">A mesma escada serve</text>
    <text x="198" y="140">à palpação, à percussão</text>
    <text x="198" y="154">e à ausculta.</text>
  </g>
</svg>
