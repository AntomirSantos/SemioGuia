<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none">
    <text x="14" y="16">A · ambiente escurecido, sem estímulo</text>
    <text x="14" y="106">B · luz oblíqua sobre um dos olhos</text>
  </g>
  <!-- A: olho direito -->
  <path d="M 40 44 C 54 30, 82 30, 96 44 C 82 58, 54 58, 40 44 Z" stroke-width="1.6" />
  <circle cx="68" cy="44" r="11" stroke-width="1.4" />
  <circle cx="68" cy="44" r="6.5" stroke-width="1.6" />
  <!-- A: olho esquerdo -->
  <path d="M 120 44 C 134 30, 162 30, 176 44 C 162 58, 134 58, 120 44 Z" stroke-width="1.6" />
  <circle cx="148" cy="44" r="11" stroke-width="1.4" />
  <circle cx="148" cy="44" r="6.5" stroke-width="1.6" />
  <g font-family="sans-serif" font-size="8.5" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="68" y="76">pupilas iguais e dilatadas</text>
    <text x="148" y="76">nos dois olhos</text>
  </g>
  <!-- B: olho direito, iluminado -->
  <path d="M 40 134 C 54 120, 82 120, 96 134 C 82 148, 54 148, 40 134 Z" stroke-width="1.6" />
  <circle cx="68" cy="134" r="11" stroke-width="1.4" />
  <circle cx="68" cy="134" r="3.2" stroke-width="1.6" />
  <!-- feixe de luz oblíquo -->
  <path d="M 16 162 L 52 140" stroke-width="1.4" />
  <path d="M 45 137 L 53 139 L 48 145" stroke-width="1.4" />
  <path d="M 20 152 L 34 144" stroke-width="1" />
  <path d="M 22 170 L 36 162" stroke-width="1" />
  <!-- B: olho esquerdo, nao iluminado -->
  <path d="M 120 134 C 134 120, 162 120, 176 134 C 162 148, 134 148, 120 134 Z" stroke-width="1.6" />
  <circle cx="148" cy="134" r="11" stroke-width="1.4" />
  <circle cx="148" cy="134" r="3.2" stroke-width="1.6" />
  <!-- marcadores -->
  <g font-family="sans-serif" font-size="10" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="96" y="122">1</text>
    <text x="176" y="122">2</text>
  </g>
  <!-- legenda -->
  <g font-family="sans-serif" font-size="8.5" fill="currentColor" stroke="none">
    <text x="196" y="42">1 reflexo fotomotor direto</text>
    <text x="204" y="54">a pupila iluminada contrai</text>
    <text x="196" y="76">2 reflexo consensual</text>
    <text x="204" y="88">a outra contrai ao mesmo</text>
    <text x="204" y="100">tempo e na mesma medida</text>
    <text x="196" y="124">a luz entra obliquamente,</text>
    <text x="196" y="136">nunca apontada para</text>
    <text x="196" y="148">dentro do olho</text>
    <text x="196" y="170">as duas respostas se</text>
    <text x="196" y="182">observam de uma só vez</text>
  </g>
</svg>
