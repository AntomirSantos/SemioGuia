<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- contorno da parede abdominal: rebordos costais, flancos, pregas inguinais -->
  <path d="M 103 28 C 92 40, 74 58, 48 70 L 50 130 C 52 148, 60 166, 82 176 L 124 176 C 146 166, 154 148, 156 130 L 158 70 C 132 58, 114 40, 103 28 Z" />
  <!-- linhas horizontais: bicostal e bi-ilíaca -->
  <path d="M 49 76 L 157 76" stroke-width="1.2" stroke-dasharray="5 3" />
  <path d="M 51 130 L 155 130" stroke-width="1.2" stroke-dasharray="5 3" />
  <!-- linhas verticais ligeiramente oblíquas, até os tubérculos púbicos -->
  <path d="M 76 44 L 88 176" stroke-width="1.2" stroke-dasharray="5 3" />
  <path d="M 130 44 L 118 176" stroke-width="1.2" stroke-dasharray="5 3" />
  <!-- cicatriz umbilical -->
  <circle cx="103" cy="103" r="3.5" stroke-width="1.4" />
  <!-- números das regiões -->
  <g font-family="sans-serif" font-size="10" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="64" y="71">1</text>
    <text x="103" y="58">2</text>
    <text x="142" y="71">3</text>
    <text x="64" y="107">4</text>
    <text x="103" y="122">5</text>
    <text x="142" y="107">6</text>
    <text x="72" y="154">7</text>
    <text x="103" y="154">8</text>
    <text x="134" y="154">9</text>
  </g>
  <!-- legenda -->
  <g font-family="sans-serif" font-size="8" fill="currentColor" stroke="none">
    <text x="170" y="36">1 hipocôndrio D · fígado</text>
    <text x="170" y="52">2 epigástrio · estômago</text>
    <text x="170" y="68">3 hipocôndrio E · baço</text>
    <text x="170" y="84">4 flanco D · cólon ascendente</text>
    <text x="170" y="100">5 mesogástrio · delgado</text>
    <text x="170" y="116">6 flanco E · cólon descendente</text>
    <text x="170" y="132">7 fossa ilíaca D · ceco</text>
    <text x="170" y="148">8 hipogástrio · bexiga</text>
    <text x="170" y="164">9 fossa ilíaca E · sigmoide</text>
  </g>
  <!-- lado do paciente -->
  <g font-family="sans-serif" font-size="8.5" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="64" y="192">direita do paciente</text>
    <text x="142" y="192">esquerda</text>
  </g>
</svg>
