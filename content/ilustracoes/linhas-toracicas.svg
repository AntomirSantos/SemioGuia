<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- títulos dos dois painéis -->
  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="85" y="16">face anterior</text>
    <text x="240" y="16">face posterior</text>
  </g>
  <!-- painel A: parede torácica anterior -->
  <path d="M 45 26 C 41 62, 47 112, 58 158 L 112 158 C 123 112, 129 62, 125 26" stroke-width="2" />
  <path d="M 50 34 L 80 41" stroke-width="1.5" />
  <path d="M 90 41 L 120 34" stroke-width="1.5" />
  <path d="M 80.5 43 L 89.5 43 L 89.5 108 L 85 120 L 80.5 108 Z" stroke-width="1.2" />
  <g stroke-width="1.2">
    <path d="M 90 54 C 104 56, 114 62, 121 72" />
    <path d="M 90 70 C 104 72, 115 80, 122 92" />
    <path d="M 90 86 C 104 89, 115 98, 121 112" />
    <path d="M 90 102 C 103 106, 112 116, 117 130" />
  </g>
  <!-- linhas verticais anteriores -->
  <g stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M 85 24 L 85 162" />
    <path d="M 105 36 L 105 160" />
    <path d="M 119 44 L 119 152" />
  </g>
  <g font-family="sans-serif" font-size="9.5" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="85" y="172">1</text>
    <text x="105" y="172">2</text>
    <text x="121" y="172">3</text>
  </g>
  <!-- painel B: parede torácica posterior -->
  <path d="M 200 26 C 196 62, 202 112, 213 158 L 267 158 C 278 112, 284 62, 280 26" stroke-width="2" />
  <!-- escápulas -->
  <g stroke-width="1.2">
    <path d="M 212 46 L 234 50 L 226 88 Z" />
    <path d="M 268 46 L 246 50 L 254 88 Z" />
  </g>
  <!-- processos espinhosos -->
  <g stroke-width="1.2">
    <path d="M 236 36 L 244 36" />
    <path d="M 236 54 L 244 54" />
    <path d="M 236 72 L 244 72" />
    <path d="M 236 90 L 244 90" />
    <path d="M 236 108 L 244 108" />
    <path d="M 236 126 L 244 126" />
  </g>
  <!-- linhas verticais posteriores -->
  <g stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M 240 24 L 240 162" />
    <path d="M 254 42 L 254 160" />
  </g>
  <g font-family="sans-serif" font-size="9.5" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="240" y="172">4</text>
    <text x="256" y="172">5</text>
  </g>
  <!-- legenda -->
  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none">
    <text x="16" y="188">1 medioesternal</text>
    <text x="102" y="188">2 hemiclavicular</text>
    <text x="196" y="188">3 axilar anterior</text>
    <text x="16" y="198">4 vertebral</text>
    <text x="102" y="198">5 escapular</text>
  </g>
</svg>
