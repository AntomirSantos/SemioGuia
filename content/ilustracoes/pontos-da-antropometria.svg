  <path d="M 205 100 L 271 100" stroke-width="2.2" stroke-dasharray="6 4" />
  <g stroke-width="1.2">
    <path d="M 194 86 L 194 114" />
    <path d="M 191 86 L 197 86" />
    <path d="M 191 114 L 197 114" />
    <path d="M 191 100 L 197 100" />
  </g>
  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none">
    <text x="280" y="82">1</text>
    <text x="280" y="104">2</text>
    <text x="280" y="120">3</text>
  </g>
  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none">
    <text x="14" y="186">1 última costela · 2 ponto médio, onde passa a fita · 3 crista ilíaca</text>
  </g>
