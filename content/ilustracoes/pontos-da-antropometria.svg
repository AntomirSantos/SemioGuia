    <text x="238" y="14">cintura: onde passa a fita</text>
  </g>
  <!-- painel A: perfil contra a parede -->
  <path d="M 34 22 L 34 168" stroke-width="2" />
  <path d="M 34 168 L 78 168" stroke-width="1.4" />
  <!-- estadiômetro -->
  <path d="M 40 40 L 74 40" stroke-width="1.4" />
  <path d="M 40 36 L 40 44" stroke-width="1.4" />
  <!-- silhueta de perfil -->
  <path d="M 56 44 C 68 44, 72 54, 68 62 C 66 66, 62 68, 58 68" stroke-width="1.6" />
  <path d="M 58 68 C 54 70, 46 74, 44 84 C 42 96, 44 108, 46 118" stroke-width="1.6" />
  <path d="M 66 66 C 74 72, 78 84, 76 98 C 74 110, 68 116, 60 120" stroke-width="1.6" />
  <path d="M 46 118 C 44 128, 42 140, 40 152 L 38 166" stroke-width="1.6" />
  <path d="M 60 120 C 60 132, 56 146, 50 158 L 46 166" stroke-width="1.6" />
  <path d="M 38 166 L 62 166" stroke-width="1.6" />
  <!-- marcadores dos cinco pontos -->
  <g stroke-width="1.4">
    <circle cx="38" cy="164" r="3.2" />
    <circle cx="38" cy="140" r="3.2" />
    <circle cx="40" cy="112" r="3.2" />
    <circle cx="42" cy="84" r="3.2" />
    <circle cx="46" cy="70" r="3.2" />
  </g>
  <g font-family="sans-serif" font-size="8.5" fill="currentColor" stroke="none">
    <text x="88" y="168">1 calcanhares</text>
    <text x="88" y="143">2 panturrilhas</text>
    <text x="88" y="115">3 glúteos</text>
    <text x="88" y="87">4 escápulas</text>
    <text x="88" y="72">5 ombros</text>
  </g>
  <!-- painel B: tronco de frente -->
  <path d="M 208 30 C 202 60, 204 92, 210 124 C 214 146, 216 158, 216 166" stroke-width="1.8" />
  <path d="M 268 30 C 274 60, 272 92, 266 124 C 262 146, 260 158, 260 166" stroke-width="1.8" />
  <path d="M 208 30 L 268 30" stroke-width="1.4" />
  <!-- última costela e crista ilíaca -->
  <path d="M 206 74 C 216 82, 228 86, 238 86" stroke-width="1.3" />
  <path d="M 270 74 C 260 82, 248 86, 238 86" stroke-width="1.3" />
  <path d="M 210 122 C 220 116, 230 114, 238 114" stroke-width="1.3" />
  <path d="M 266 122 C 256 116, 246 114, 238 114" stroke-width="1.3" />
