<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- parede torácica anterior -->
  <path d="M 44 26 C 40 68, 46 124, 58 178 L 162 178 C 174 124, 180 68, 176 26" stroke-width="2" />
  <!-- clavículas -->
  <path d="M 50 34 L 104 42" stroke-width="1.5" />
  <path d="M 116 42 L 170 34" stroke-width="1.5" />
  <!-- esterno e apêndice xifoide -->
  <path d="M 104 42 L 116 42 L 116 128 L 110 142 L 104 128 Z" stroke-width="1.2" />
  <!-- rebordos costais -->
  <path d="M 110 142 C 98 149, 86 158, 76 170" stroke-width="1.2" />
  <path d="M 110 142 C 122 149, 134 158, 144 170" stroke-width="1.2" />
  <!-- 2 submacicez precordial -->
  <path d="M 118 94 C 134 90, 150 100, 147 114 C 144 128, 126 132, 119 124 Z" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- 3 macicez hepática -->
  <path d="M 60 124 L 106 140 L 70 172 Z" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- 4 timpanismo do espaço de Traube -->
  <path d="M 146 134 L 114 142 L 134 162 Z" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- números -->
  <g font-family="sans-serif" font-size="10" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="76" y="74">1</text>
    <text x="146" y="74">1</text>
    <text x="133" y="114">2</text>
    <text x="80" y="146">3</text>
    <text x="131" y="149">4</text>
  </g>
  <!-- legenda -->
  <g font-family="sans-serif" font-size="9.5" fill="currentColor" stroke="none">
    <text x="192" y="60">1 som claro pulmonar</text>
    <text x="192" y="82">2 submacicez precordial</text>
    <text x="192" y="104">3 macicez hepática</text>
    <text x="192" y="126">4 timpanismo</text>
    <text x="202" y="139">espaço de Traube</text>
  </g>
  <!-- lado do paciente -->
  <g font-family="sans-serif" font-size="8.5" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="72" y="194">direita do paciente</text>
    <text x="148" y="194">esquerda</text>
  </g>
</svg>
