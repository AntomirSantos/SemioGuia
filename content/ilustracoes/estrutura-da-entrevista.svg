<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="160" y="14">as cinco etapas da entrevista</text>
  </g>
  <!-- as cinco etapas -->
  <g stroke-width="1.6">
    <rect x="8" y="24" width="52" height="32" rx="6" />
    <rect x="70" y="24" width="52" height="32" rx="6" />
    <rect x="132" y="24" width="52" height="32" rx="6" />
    <rect x="194" y="24" width="52" height="32" rx="6" />
    <rect x="256" y="24" width="52" height="32" rx="6" />
  </g>
  <g font-family="sans-serif" font-size="13" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="34" y="45">1</text>
    <text x="96" y="45">2</text>
    <text x="158" y="45">3</text>
    <text x="220" y="45">4</text>
    <text x="282" y="45">5</text>
  </g>
  <!-- setas entre as etapas -->
  <g stroke-width="1.4">
    <path d="M 62 40 L 67 40" />
    <path d="M 64.5 37.5 L 67 40 L 64.5 42.5" />
    <path d="M 124 40 L 129 40" />
    <path d="M 126.5 37.5 L 129 40 L 126.5 42.5" />
    <path d="M 186 40 L 191 40" />
    <path d="M 188.5 37.5 L 191 40 L 188.5 42.5" />
    <path d="M 248 40 L 253 40" />
    <path d="M 250.5 37.5 L 253 40 L 250.5 42.5" />
  </g>
  <!-- funil das perguntas, ligado as etapas 2 e 3 -->
  <g stroke-width="1.1" stroke-dasharray="3 3">
    <path d="M 96 57 L 96 79" />
    <path d="M 158 57 L 158 86" />
  </g>
  <path d="M 72 78 L 182 90 L 182 98 L 72 110 Z" stroke-width="1.3" />
  <g font-family="sans-serif" font-size="8" fill="currentColor" stroke="none">
    <text x="90" y="71" text-anchor="end">abertas</text>
    <text x="164" y="76">fechadas</text>
  </g>
  <!-- banda da escuta ativa -->
  <rect x="8" y="118" width="300" height="20" rx="10" stroke-width="1.6" />
  <g font-family="sans-serif" font-size="8.5" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="158" y="131">escuta ativa e relação médico-paciente, nas cinco etapas</text>
  </g>
  <!-- legenda -->
  <g font-family="sans-serif" font-size="8.5" fill="currentColor" stroke="none">
    <text x="12" y="156">1 acolhimento e identificação</text>
    <text x="12" y="170">2 narrativa livre do paciente</text>
    <text x="12" y="184">3 perguntas dirigidas</text>
    <text x="176" y="156">4 resumo de checagem</text>
    <text x="176" y="170">5 fechamento e dúvidas</text>
  </g>
</svg>
