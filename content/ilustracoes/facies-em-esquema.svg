  <path d="M 126 38 C 143 38, 152 54, 150 76 C 148 96, 138 108, 126 108 C 114 108, 104 96, 102 76 C 100 54, 109 38, 126 38 Z" stroke-width="2" />
  <g stroke-width="1.4">
