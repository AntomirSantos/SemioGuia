  <path d="M 286 38 C 302 38, 310 54, 308 76 C 306 96, 297 108, 286 108 C 275 108, 266 96, 264 76 C 262 54, 270 38, 286 38 Z" stroke-width="2" />
  <g stroke-width="1.4">
    <circle cx="277" cy="65" r="5" />
    <circle cx="295" cy="65" r="5" />
