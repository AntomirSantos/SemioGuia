  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="46" y="126">A</text>
    <text x="126" y="126">B</text>
    <text x="206" y="126">C</text>
    <text x="286" y="126">D</text>
  </g>
  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none">
    <text x="14" y="146">A atípica — nenhum padrão reconhecível</text>
    <text x="14" y="160">B hipocrática — olhos fundos, nariz afilado, lábios finos</text>
    <text x="14" y="174">C cushingoide — rosto arredondado, traços atenuados</text>
    <text x="14" y="188">D basedowiana — olhos salientes, fenda palpebral aberta</text>
  </g>
