<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="76" y="14">pontos sinusais</text>
    <text x="216" y="14">articulação temporomandibular</text>
  </g>
  <!-- A: face de frente -->
  <path d="M 76 24 C 46 24, 38 52, 40 78 C 42 108, 54 138, 76 148 C 98 138, 110 108, 112 78 C 114 52, 106 24, 76 24 Z" stroke-width="1.6" />
  <!-- sobrancelhas -->
  <path d="M 50 60 C 56 55, 64 55, 68 59" stroke-width="1.4" />
  <path d="M 84 59 C 88 55, 96 55, 102 60" stroke-width="1.4" />
  <!-- olhos -->
  <path d="M 51 70 C 56 65, 64 65, 68 70 C 64 75, 56 75, 51 70 Z" stroke-width="1.2" />
  <path d="M 84 70 C 88 65, 96 65, 101 70 C 96 75, 88 75, 84 70 Z" stroke-width="1.2" />
  <circle cx="59" cy="70" r="2.4" stroke-width="1.2" />
  <circle cx="93" cy="70" r="2.4" stroke-width="1.2" />
  <!-- nariz e boca -->
  <path d="M 76 74 L 72 96 L 80 96" stroke-width="1.2" />
  <path d="M 64 118 C 70 122, 82 122, 88 118" stroke-width="1.4" />
  <!-- projecao dos seios frontais -->
  <path d="M 56 46 C 62 40, 70 40, 74 46 L 74 54 C 68 50, 62 50, 56 54 Z" stroke-width="1.3" stroke-dasharray="3 3" />
  <path d="M 78 46 C 82 40, 90 40, 96 46 L 96 54 C 90 50, 84 50, 78 54 Z" stroke-width="1.3" stroke-dasharray="3 3" />
  <!-- projecao dos seios maxilares -->
  <path d="M 50 86 C 58 82, 66 84, 68 92 C 66 102, 58 106, 50 100 Z" stroke-width="1.3" stroke-dasharray="3 3" />
  <path d="M 102 86 C 94 82, 86 84, 84 92 C 86 102, 94 106, 102 100 Z" stroke-width="1.3" stroke-dasharray="3 3" />
  <!-- setas de compressao, de baixo para cima -->
  <path d="M 65 66 L 65 56" stroke-width="1.4" />
  <path d="M 62 60 L 65 55 L 68 60" stroke-width="1.4" />
  <path d="M 58 108 L 58 98" stroke-width="1.4" />
  <path d="M 55 102 L 58 97 L 61 102" stroke-width="1.4" />
  <!-- marcadores A -->
  <g font-family="sans-serif" font-size="10" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="88" y="40">1</text>
    <text x="93" y="96">2</text>
  </g>
  <!-- B: cabeca de perfil -->
  <path d="M 214 26 C 190 30, 178 54, 180 78 C 182 100, 190 116, 200 124 L 200 140 C 214 148, 236 148, 250 140" stroke-width="1.6" />
  <path d="M 214 26 C 240 28, 254 48, 254 74 C 254 104, 246 128, 250 140" stroke-width="1.6" />
  <!-- pavilhao auricular -->
  <path d="M 224 66 C 214 66, 210 78, 212 88 C 214 98, 220 104, 226 102" stroke-width="1.4" />
  <!-- trago e meato -->
  <path d="M 224 82 C 220 82, 218 86, 219 90" stroke-width="1.3" />
  <circle cx="223" cy="88" r="2.2" stroke-width="1.2" />
  <!-- mandibula -->
  <path d="M 216 78 C 210 96, 206 112, 208 126 C 216 136, 232 138, 244 132" stroke-width="1.3" stroke-dasharray="4 3" />
  <!-- ponto 3: 1 cm a frente do trago -->
  <circle cx="209" cy="80" r="3.4" stroke-width="1.5" />
  <!-- ponto 4: via posterior, pela entrada do conduto -->
  <circle cx="228" cy="90" r="3.4" stroke-width="1.5" />
  <!-- seta indicando o sentido posterior -->
  <path d="M 240 96 L 233 92" stroke-width="1.3" />
  <path d="M 237 96 L 232 92 L 237 89" stroke-width="1.3" />
  <!-- marcadores B -->
  <g font-family="sans-serif" font-size="10" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="197" y="70">3</text>
    <text x="244" y="82">4</text>
  </g>
  <!-- legenda -->
  <g font-family="sans-serif" font-size="8.5" fill="currentColor" stroke="none">
    <text x="14" y="164">1 seios frontais: compressão da parte óssea da sobrancelha, de baixo para cima</text>
    <text x="14" y="176">2 seios maxilares: compressão da região malar, de baixo para cima</text>
    <text x="14" y="188">3 ATM lateral, 1 cm à frente do trago   ·   4 ATM posterior, pela entrada do conduto</text>
  </g>
</svg>
