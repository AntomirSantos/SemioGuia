<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none">
    <text x="10" y="13">Teste do relógio — normal × anormal</text>
  </g>
  <g font-family="sans-serif" font-size="8" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="80" y="32">normal</text>
    <text x="240" y="32">anormal</text>
  </g>
  <circle cx="80" cy="112" r="50" stroke-width="1.5" />
  <circle cx="240" cy="112" r="50" stroke-width="1.5" />
  <!-- números do relógio normal: sentido horário, número h no ângulo h × 30° a partir do 12 -->
  <g font-family="sans-serif" font-size="7.5" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="100.5" y="79.1">1</text>
    <text x="115.5" y="94.1">2</text>
    <text x="121" y="114.6">3</text>
    <text x="115.5" y="135.1">4</text>
    <text x="100.5" y="150.1">5</text>
    <text x="80" y="155.6">6</text>
    <text x="59.5" y="150.1">7</text>
    <text x="44.5" y="135.1">8</text>
    <text x="39" y="114.6">9</text>
    <text x="44.5" y="94.1">10</text>
    <text x="59.5" y="79.1">11</text>
    <text x="80" y="73.6">12</text>
  </g>
  <!-- ponteiros em 8h20: hora a 250° (entre o 8 e o 9), minuto a 120° (sobre o 4) -->
  <path d="M 80 112 L 59.3 119.5" stroke-width="2" />
  <path d="M 80 112 L 108.6 128.5" stroke-width="1.4" />
  <circle cx="80" cy="112" r="1.6" stroke-width="1.2" />
  <!-- números do relógio anormal: rotação anti-horária, número h no ângulo −h × 30° -->
  <g font-family="sans-serif" font-size="7.5" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="219.5" y="79.1">1</text>
    <text x="204.5" y="94.1">2</text>
    <text x="199" y="114.6">3</text>
    <text x="204.5" y="135.1">4</text>
    <text x="219.5" y="150.1">5</text>
    <text x="240" y="155.6">6</text>
    <text x="260.5" y="150.1">7</text>
    <text x="275.5" y="135.1">8</text>
    <text x="281" y="114.6">9</text>
    <text x="275.5" y="94.1">10</text>
    <text x="260.5" y="79.1">11</text>
    <text x="240" y="73.6">12</text>
  </g>
  <g font-family="sans-serif" font-size="7" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="80" y="176">números em ordem horária, junto à borda;</text>
    <text x="80" y="185">ponteiros marcando 8h20</text>
    <text x="240" y="176">rotação anti-horária dos números —</text>
    <text x="240" y="185">um dos padrões anormais</text>
  </g>
  <g font-family="sans-serif" font-size="7" fill="currentColor" stroke="none">
    <text x="10" y="197">Wolf-Klein pontua a ordem dos números; os ponteiros são exigência do Mini-Cog</text>
  </g>
</svg>
