  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none">
    <text x="14" y="14">A · úlcera arterial</text>
    <text x="186" y="14">B · úlcera venosa</text>
  </g>
  <path d="M 168 20 L 168 170" stroke-width="1" stroke-dasharray="3 3" />
  <!-- A perna e pe -->
