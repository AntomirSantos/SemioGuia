<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <g font-family="sans-serif" font-size="9" fill="currentColor" stroke="none">
    <text x="10" y="13">Ilusão · alucinação · alucinose</text>
  </g>
  <g font-family="sans-serif" font-size="8" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="60" y="32">ilusão</text>
    <text x="160" y="32">alucinação</text>
    <text x="260" y="32">alucinose</text>
  </g>
  <!-- coluna 1: objeto real presente -->
  <path d="M 52 44 L 56 82 L 64 82 L 68 44 Z" stroke-width="1.5" />
  <path d="M 44 44 L 76 44" stroke-width="1.5" />
  <!-- coluna 2 e 3: ausência de objeto (tracejado) -->
  <path d="M 146 44 L 174 44 L 174 82 L 146 82 Z" stroke-width="1.2" stroke-dasharray="4 3" />
  <path d="M 246 44 L 274 44 L 274 82 L 246 82 Z" stroke-width="1.2" stroke-dasharray="4 3" />
  <g font-family="sans-serif" font-size="7" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="60" y="94">objeto existe</text>
    <text x="160" y="94">sem objeto</text>
    <text x="260" y="94">sem objeto</text>
  </g>
  <!-- setas da percepção -->
  <path d="M 60 100 L 60 116" stroke-width="1.4" />
  <path d="M 56 111 L 60 116 L 64 111" stroke-width="1.2" />
  <path d="M 160 100 L 160 116" stroke-width="1.4" />
  <path d="M 156 111 L 160 116 L 164 111" stroke-width="1.2" />
  <path d="M 260 100 L 260 116" stroke-width="1.4" />
  <path d="M 256 111 L 260 116 L 264 111" stroke-width="1.2" />
  <!-- o que o paciente vive -->
  <path d="M 24 122 L 96 122 L 96 152 L 24 152 Z" stroke-width="1.2" />
  <path d="M 124 122 L 196 122 L 196 152 L 124 152 Z" stroke-width="1.2" />
  <path d="M 224 122 L 296 122 L 296 152 L 224 152 Z" stroke-width="1.2" />
  <g font-family="sans-serif" font-size="7" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="60" y="134">percepção</text>
    <text x="60" y="143">deformada</text>
    <text x="160" y="134">percebida e</text>
    <text x="160" y="143">vivida como real</text>
    <text x="260" y="134">percebida, mas</text>
    <text x="260" y="143">com crítica</text>
  </g>
  <g font-family="sans-serif" font-size="7" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="60" y="168">pouco valor</text>
    <text x="60" y="177">diagnóstico</text>
    <text x="160" y="168">sem crítica:</text>
    <text x="160" y="177">quadro psicótico ou orgânico</text>
    <text x="260" y="168">pensar causa</text>
    <text x="260" y="177">orgânica</text>
  </g>
</svg>
