<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- tronco: gradil costal inferior e andar superior do abdome -->
  <path d="M 44 24 C 40 60, 42 96, 52 132 L 52 172" stroke-width="2" />
  <path d="M 176 24 C 180 60, 178 96, 168 132 L 168 172" stroke-width="2" />
  <!-- esterno e apêndice xifoide -->
  <path d="M 104 30 L 116 30 L 116 84 L 110 96 L 104 84 Z" stroke-width="1.2" />
  <!-- rebordos costais -->
  <path d="M 110 96 C 94 106, 72 116, 50 122" stroke-width="1.4" />
  <path d="M 110 96 C 126 106, 148 116, 170 122" stroke-width="1.4" />
  <!-- linha hemiclavicular direita -->
  <path d="M 74 26 L 74 166" stroke-width="1.1" stroke-dasharray="4 4" />
  <!-- limite superior da macicez hepática -->
  <path d="M 60 70 L 92 70" stroke-width="1.6" />
  <!-- borda inferior do fígado -->
  <path d="M 60 128 L 92 128" stroke-width="1.6" />
  <!-- seta dupla da hepatimetria -->
  <path d="M 82 74 L 82 124" stroke-width="1.4" />
  <path d="M 78 79 L 82 73 L 86 79" stroke-width="1.4" />
  <path d="M 78 119 L 82 125 L 86 119" stroke-width="1.4" />
  <!-- espaço de Traube: triângulo timpânico sobre o fundo gástrico -->
  <path d="M 124 92 L 166 102 L 142 116 Z" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- marcadores -->
  <g font-family="sans-serif" font-size="10" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="58" y="66">1</text>
    <text x="60" y="142">2</text>
    <text x="95" y="88">3</text>
    <text x="144" y="106">4</text>
  </g>
  <!-- legenda -->
  <g font-family="sans-serif" font-size="8.5" fill="currentColor" stroke="none">
    <text x="192" y="52">1 limite superior</text>
    <text x="200" y="65">5º–6º espaço intercostal</text>
    <text x="192" y="86">2 borda inferior</text>
    <text x="200" y="99">palpação, junto ao rebordo</text>
    <text x="192" y="120">3 hepatimetria</text>
    <text x="200" y="133">medida na hemiclavicular</text>
    <text x="192" y="154">4 espaço de Traube</text>
    <text x="200" y="167">timpânico quando livre</text>
  </g>
  <!-- lado do paciente -->
  <g font-family="sans-serif" font-size="8.5" fill="currentColor" stroke="none" text-anchor="middle">
    <text x="70" y="190">direita do paciente</text>
    <text x="148" y="190">esquerda</text>
  </g>
</svg>
